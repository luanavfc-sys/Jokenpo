<!DOCTYPE html>

<head>

    <title> LV JOKENPO </title>
    
</head>
<body>
    <div class="container">
        <h1> LV JOKENPO </h1>

        <div class="buttons">
        <button class="pedra" onclick="playHuman('pedra')">&#x1F44A;</button>
        <button class="papel" onclick="playHuman('papel')"> &#x1F590;</button>
        <button class="tesoura" onclick="playHuman('tesoura')"> &#x270C; </button>

        <p id="result"></p>

        <p class="your-score">

            Pontuação da Alexa: <span id="machine-score">0</span>
        </p>
    </div>
</body>
